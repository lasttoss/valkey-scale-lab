apiVersion: v1
kind: Service
metadata:
  name: {{ include "valkey-scale-lab.fullname" . }}-valkey
  labels:
    {{- include "valkey-scale-lab.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: valkey
      port: {{ .Values.valkey.service.port }}
      targetPort: valkey
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "valkey-scale-lab.fullname" . }}-valkey
  labels:
    {{- include "valkey-scale-lab.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "valkey-scale-lab.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: valkey
  template:
    metadata:
      labels:
        {{- include "valkey-scale-lab.labels" . | nindent 8 }}
        app.kubernetes.io/component: valkey
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: valkey
          image: {{ .Values.valkey.image | quote }}
          # No persistence: a lab that keeps yesterday's keys measures yesterday's keyspace.
          args:
            - valkey-server
            - --maxclients
            - {{ .Values.valkey.maxClients | quote }}
            - --save
            - ""
            - --appendonly
            - "no"
          ports:
            - name: valkey
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            initialDelaySeconds: 1
            periodSeconds: 1
          resources:
            {{- toYaml .Values.valkey.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
